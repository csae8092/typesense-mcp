[project]
name = "typesense-mcp"
version = "0.1.0"
description = "A configurable MCP server for searching Typesense collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0,<3",
    "typesense>=1.0,<2",
]

[project.scripts]
typesense-mcp = "typesense_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typesense_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
